<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Слайдер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slider">
    <div class="slider__track">
      <div class="slide">
        <img src="images/autumn.jpg" alt="Осень">
      </div>
      <div class="slide">
        <img src="images/winter.jpg" alt="Зима">
      </div>
      <div class="slide">
        <img src="images/summer.jpg" alt="Лето">
      </div>
    </div>
    <button class="slider__btn slider__btn--prev">←</button>
    <button class="slider__btn slider__btn--next">→</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
